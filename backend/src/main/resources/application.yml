spring:
  application:
    name: skillproof
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillproof}
    username: ${DB_USERNAME:skillproof}
    password: ${DB_PASSWORD:skillproof_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
